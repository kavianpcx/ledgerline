name: ledgerline
description: Offline-first double-entry accounting for Windows and Android.
publish_to: "none"
version: 0.6.0-beta.1+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  file_picker: ^10.3.7
  excel: ^4.0.6
  mobile_scanner: ^7.5.0
  crypto: ^3.0.8
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  url_launcher: ^6.3.2
  window_manager: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf
