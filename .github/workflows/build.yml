name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze

  test:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - test/accounting_engine_test.dart
          - test/money_test.dart
          - test/ledger_repository_test.dart
          - test/product_import_test.dart
          - test/pos_checkout_test.dart
          - test/widget_test.dart
          - test/desktop_navigation_test.dart
          - test/update_service_test.dart
          - test/searchable_select_test.dart
          - test/settings_control_center_test.dart
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux window dependencies
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Test ${{ matrix.test_file }}
        run: flutter test ${{ matrix.test_file }} --reporter expanded --timeout 120s

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name=ledgerline --org=com.ledgerline .
      - name: Install Ledgerline Windows shortcuts
        shell: pwsh
        run: ./tool/patch_windows_shortcuts.ps1
      - name: Resolve dependencies
        run: flutter pub get
      - name: Install Tesseract runtime
        shell: pwsh
        run: |
          $tesseractVersion = '5.5.3.20260724'
          $installerPath = Join-Path $env:RUNNER_TEMP ('tesseract-ocr-w64-setup-' + $tesseractVersion + '.exe')
          $installerUrl = 'https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-' + $tesseractVersion + '.exe'
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          $installer = Start-Process -FilePath $installerPath -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Tesseract installer exited with code $($installer.ExitCode)." }
          $tesseractCandidates = @(
            (Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles')) 'Tesseract-OCR/tesseract.exe'),
            (Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Tesseract-OCR/tesseract.exe')
          )
          $installedTesseract = $tesseractCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $installedTesseract) { throw 'Pinned Tesseract installer did not install tesseract.exe.' }
      - name: Read application version
        shell: pwsh
        run: |
          $versionLine = (Select-String -Path pubspec.yaml -Pattern '^version:').Line
          $appVersion = $versionLine.Split(':', 2)[1].Trim().Split('+')[0]
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release --dart-define=APP_VERSION=$env:APP_VERSION
      - name: Bundle English and Persian OCR models
        shell: pwsh
        run: |
          $programFiles = [Environment]::GetEnvironmentVariable('ProgramFiles')
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $candidates = @(
            (Join-Path (Join-Path $programFiles 'Tesseract-OCR') 'tesseract.exe'),
            (Join-Path (Join-Path $programFilesX86 'Tesseract-OCR') 'tesseract.exe'),
            (Join-Path $env:ChocolateyInstall 'lib/tesseract/tools/tesseract.exe')
          )
          $sourceExe = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $sourceExe) { $sourceExe = (Get-Command tesseract.exe -ErrorAction SilentlyContinue).Source }
          if (-not $sourceExe) { throw 'Tesseract installation did not provide tesseract.exe.' }
          $sourceDirectory = Split-Path -Parent $sourceExe
          $releaseDirectory = Join-Path $PWD 'build/windows/x64/runner/Release'
          $ocrDirectory = Join-Path $releaseDirectory 'ocr'
          $tessdataDirectory = Join-Path $ocrDirectory 'tessdata'
          New-Item -ItemType Directory -Force -Path $ocrDirectory, $tessdataDirectory | Out-Null
          Copy-Item -LiteralPath $sourceExe -Destination $ocrDirectory -Force
          Get-ChildItem -LiteralPath $sourceDirectory -Filter '*.dll' -File | Copy-Item -Destination $ocrDirectory -Force
          $modelRevision = '87416418657359cb625c412a48b6e1d6d41c29bd'
          $modelBase = 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/' + $modelRevision
          foreach ($language in @('eng', 'fas')) {
            Invoke-WebRequest -Uri ($modelBase + '/' + $language + '.traineddata') -OutFile (Join-Path $tessdataDirectory ($language + '.traineddata'))
          }
          Invoke-WebRequest -Uri ($modelBase + '/LICENSE') -OutFile (Join-Path $ocrDirectory 'TESSDATA-LICENSE.txt')
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tesseract/main/LICENSE' -OutFile (Join-Path $ocrDirectory 'TESSERACT-LICENSE.txt')
          $languages = (& (Join-Path $ocrDirectory 'tesseract.exe') --tessdata-dir $tessdataDirectory --list-langs 2>&1) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or $languages -notmatch 'eng' -or $languages -notmatch 'fas') {
            throw 'Bundled OCR engine is missing English or Persian language data.'
          }
          Add-Type -AssemblyName System.Drawing
          $samplePath = Join-Path $env:RUNNER_TEMP 'ledgerline-ocr-smoke.png'
          $bitmap = [System.Drawing.Bitmap]::new(1500, 220)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::White)
          $graphics.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAlias
          $font = [System.Drawing.Font]::new('Arial', 54, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
          $graphics.DrawString('INVOICE TOTAL 12345', $font, [System.Drawing.Brushes]::Black, 25, 65)
          $bitmap.Save($samplePath, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $font.Dispose()
          $bitmap.Dispose()
          $recognized = (& (Join-Path $ocrDirectory 'tesseract.exe') $samplePath stdout --tessdata-dir $tessdataDirectory -l eng --psm 6 2>&1) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or $recognized -notmatch 'INVOICE' -or $recognized -notmatch '12345') {
            throw ('Offline OCR smoke test did not recognize the sample receipt. Output: ' + $recognized)
          }
          Write-Host ('Offline OCR smoke test recognized: ' + $recognized)
      - name: Set installer version
        shell: pwsh
        run: Set-Content -Path installer/app_version.iss -Value ('#define AppVersion "' + $env:APP_VERSION + '"') -Encoding ascii
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ledgerline.iss'
      - name: Capture Windows UI evidence
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class LedgerlineWindowTest {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr handle);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr handle, int command);
            [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr handle);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr handle);
            [DllImport("user32.dll")] public static extern bool IsZoomed(IntPtr handle);
            [StructLayout(LayoutKind.Sequential)] public struct WindowRect {
              public int Left; public int Top; public int Right; public int Bottom;
            }
            [DllImport("user32.dll", SetLastError = true)] public static extern bool GetWindowRect(IntPtr handle, out WindowRect rectangle);
            public static int[] GetWindowBounds(IntPtr handle) {
              WindowRect rectangle;
              if (!GetWindowRect(handle, out rectangle)) return null;
              return new int[] { rectangle.Left, rectangle.Top, rectangle.Right - rectangle.Left, rectangle.Bottom - rectangle.Top };
            }
            [DllImport("user32.dll", SetLastError = true)] public static extern bool MoveWindow(IntPtr handle, int x, int y, int width, int height, bool repaint);
            [StructLayout(LayoutKind.Sequential)] public struct Input {
              public uint type;
              public InputUnion data;
            }
            [StructLayout(LayoutKind.Explicit)] public struct InputUnion {
              [FieldOffset(0)] public MouseInput mouse;
              [FieldOffset(0)] public KeyboardInput keyboard;
            }
            [StructLayout(LayoutKind.Sequential)] public struct MouseInput {
              public int dx; public int dy; public uint mouseData; public uint flags; public uint time; public IntPtr extra;
            }
            [StructLayout(LayoutKind.Sequential)] public struct KeyboardInput {
              public ushort vk; public ushort scan; public uint flags; public uint time; public IntPtr extra;
            }
            [DllImport("user32.dll", SetLastError = true)] private static extern uint SendInput(uint count, Input[] inputs, int size);
            public static bool SendChord(ushort key) {
              ushort[] keys = new ushort[] { 0x11, 0x10, key };
              Input[] inputs = new Input[6];
              for (int i = 0; i < keys.Length; i++) {
                inputs[i] = new Input { type = 1, data = new InputUnion { keyboard = new KeyboardInput { vk = keys[i] } } };
              }
              for (int i = keys.Length - 1; i >= 0; i--) {
                inputs[keys.Length + (keys.Length - 1 - i)] = new Input {
                  type = 1,
                  data = new InputUnion { keyboard = new KeyboardInput { vk = keys[i], flags = 2 } }
                };
              }
              return SendInput((uint)inputs.Length, inputs, Marshal.SizeOf(typeof(Input))) == inputs.Length;
            }
          }
          "@
          $evidenceDirectory = Join-Path $PWD 'ui-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          $releaseOcrDirectory = Join-Path $PWD 'build/windows/x64/runner/Release/ocr'
          $tesseractPath = Join-Path $releaseOcrDirectory 'tesseract.exe'
          $tessdataDirectory = Join-Path $releaseOcrDirectory 'tessdata'
          if (-not (Test-Path -LiteralPath $tesseractPath)) { throw 'The bundled Tesseract executable is missing from the Windows release build.' }
          foreach ($languageModel in @('eng', 'fas')) {
            if (-not (Test-Path -LiteralPath (Join-Path $tessdataDirectory ($languageModel + '.traineddata')))) {
              throw "The bundled $languageModel OCR model is missing."
            }
          }
          $evidenceReport = Join-Path $evidenceDirectory 'capture-verification.txt'
          Set-Content -Path $evidenceReport -Value ('commit=' + $env:GITHUB_SHA) -Encoding utf8
          $script:uiVerificationFailures = [System.Collections.Generic.List[string]]::new()

          function Assert-VisibleUiText {
            param([string]$ImagePath, [string]$Scenario)
            $language = if ($Scenario -eq 'settings-fa') { 'fas+eng' } else { 'eng+fas' }
            $recognized = (& $tesseractPath $ImagePath stdout --tessdata-dir $tessdataDirectory -l $language --psm 11 2>&1) -join [Environment]::NewLine
            if ($LASTEXITCODE -ne 0) { throw "Tesseract could not inspect $Scenario. Output: $recognized" }
            $expected = @(
              switch ($Scenario) {
                'titlebar' { 'Your books'; 'Total assets' }
                'windows-sidebar-wide' { 'Products'; 'Your books' }
                'windows-sidebar-medium' { 'Your books'; 'Total assets' }
                'windows-sidebar-narrow' { 'Your books'; 'Total assets' }
                'settings-light' { 'Settings'; 'General' }
                'settings-dark' { 'Settings'; 'Appearance'; 'Dark mode' }
                'settings-fa' { }
                'currency-popup' { 'Settings'; 'Search currencies'; 'US Dollar' }
                'installer-launch' { 'Your books'; 'Total assets' }
                default { throw "No visible-text expectations are defined for $Scenario." }
              }
            )
            foreach ($expectedText in $expected) {
              if ($recognized -notmatch [Regex]::Escape($expectedText)) {
                throw "Visible text '$expectedText' was missing from $Scenario. OCR output: $recognized"
              }
            }
            if ($Scenario -eq 'settings-fa' -and $recognized -notmatch 'زبان|منطقه') {
              throw "Persian settings labels were missing from $Scenario. OCR output: $recognized"
            }
            if ($Scenario -eq 'titlebar') {
              $titleImage = [System.Drawing.Bitmap]::new($ImagePath)
              $scaledTitle = $null
              $titleGraphics = $null
              try {
                $titleHeight = [Math]::Min(100, $titleImage.Height)
                $scaleFactor = 3
                $scaledTitle = [System.Drawing.Bitmap]::new($titleImage.Width * $scaleFactor, $titleHeight * $scaleFactor)
                $titleGraphics = [System.Drawing.Graphics]::FromImage($scaledTitle)
                $titleGraphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $titleGraphics.DrawImage(
                  $titleImage,
                  [System.Drawing.Rectangle]::new(0, 0, $scaledTitle.Width, $scaledTitle.Height),
                  [System.Drawing.Rectangle]::new(0, 0, $titleImage.Width, $titleHeight),
                  [System.Drawing.GraphicsUnit]::Pixel
                )
                $titleImagePath = Join-Path $env:RUNNER_TEMP 'ledgerline-titlebar-upscaled.png'
                $scaledTitle.Save($titleImagePath, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                if ($null -ne $titleGraphics) { $titleGraphics.Dispose() }
                if ($null -ne $scaledTitle) { $scaledTitle.Dispose() }
                $titleImage.Dispose()
              }
              $titleText = (& $tesseractPath $titleImagePath stdout --tessdata-dir $tessdataDirectory -l eng --psm 6 2>&1) -join [Environment]::NewLine
              if ($LASTEXITCODE -ne 0 -or $titleText -notmatch 'Ledgerline') {
                throw "Ledgerline title text was missing from the upscaled $Scenario title strip. OCR output: $titleText"
              }
              Add-Content -Path $evidenceReport -Value ("titlebar=" + $Scenario + "; recognized=" + ($titleText -replace '[\r\n]+', ' ')) -Encoding utf8
              Write-Host ("Verified titlebar text in " + $Scenario + ": " + ($titleText -replace '[\r\n]+', ' '))
            }
            Add-Content -Path $evidenceReport -Value ("scenario=" + $Scenario + "; expected=" + ($expected -join '|') + "; recognized=" + ($recognized -replace '[\r\n]+', ' ')) -Encoding utf8
            Write-Host ("Verified visible text in " + $Scenario + ": " + ($recognized -replace '[\r\n]+', ' '))
          }

          function Save-WindowEvidence {
            param([IntPtr]$WindowHandle, [string]$ImagePath, [string]$Scenario)
            $windowBounds = [LedgerlineWindowTest]::GetWindowBounds($WindowHandle)
            if ($null -eq $windowBounds) { throw "Could not read the window bounds for $Scenario." }
            $screenBounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $left = [Math]::Max([int]$windowBounds[0], [int]$screenBounds.Left)
            $top = [Math]::Max([int]$windowBounds[1], [int]$screenBounds.Top)
            $right = [Math]::Min(([int]$windowBounds[0] + [int]$windowBounds[2]), [int]$screenBounds.Right)
            $bottom = [Math]::Min(([int]$windowBounds[1] + [int]$windowBounds[3]), [int]$screenBounds.Bottom)
            $width = $right - $left
            $height = $bottom - $top
            if ($width -lt 480 -or $height -lt 300) { throw "The visible $Scenario window area is too small to verify." }
            $bitmap = [System.Drawing.Bitmap]::new($width, $height)
            $graphics = $null
            try {
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen([System.Drawing.Point]::new($left, $top), [System.Drawing.Point]::Empty, [System.Drawing.Size]::new($width, $height))
              $bitmap.Save($ImagePath, [System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              if ($null -ne $graphics) { $graphics.Dispose() }
              $bitmap.Dispose()
            }
            try {
              Assert-VisibleUiText -ImagePath $ImagePath -Scenario $Scenario
            } catch {
              $verificationError = $Scenario + ': ' + $_.Exception.Message
              $script:uiVerificationFailures.Add($verificationError)
              Add-Content -Path $evidenceReport -Value ('verification_error=' + $verificationError) -Encoding utf8
              Write-Host ('UI_TEXT_ASSERTION_FAILED ' + $verificationError)
            }
          }

          $smokeInstallDirectory = Join-Path $env:RUNNER_TEMP 'LedgerlineInstallerSmoke'
          $installerPath = Join-Path $PWD 'installer/output/ledgerline-windows-setup.exe'
          $setup = Start-Process -FilePath $installerPath -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$smokeInstallDirectory") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Windows installer exited with code $($setup.ExitCode)." }
          $installedApplication = Join-Path $smokeInstallDirectory 'ledgerline.exe'
          if (-not (Test-Path -LiteralPath $installedApplication)) { throw 'Installer did not place ledgerline.exe in the selected install directory.' }
          $smokeProcess = Start-Process -FilePath $installedApplication -PassThru
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            Start-Sleep -Seconds 1
            $smokeProcess.Refresh()
            if ($smokeProcess.HasExited) { throw 'Installed Ledgerline exited during smoke-test startup.' }
            if ($smokeProcess.MainWindowHandle -ne [IntPtr]::Zero -and [LedgerlineWindowTest]::IsWindowVisible($smokeProcess.MainWindowHandle)) { break }
          }
          $smokeProcess.Refresh()
          if ($smokeProcess.MainWindowHandle -eq [IntPtr]::Zero -or -not [LedgerlineWindowTest]::IsWindowVisible($smokeProcess.MainWindowHandle)) {
            throw 'Installed Ledgerline did not create a visible Windows application window.'
          }
          [LedgerlineWindowTest]::SetForegroundWindow($smokeProcess.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 3
          if ([LedgerlineWindowTest]::GetForegroundWindow() -ne $smokeProcess.MainWindowHandle) { throw 'Installed Ledgerline was not the foreground window for its launch evidence.' }
          $installedImage = Join-Path $evidenceDirectory 'installer-launch.png'
          Save-WindowEvidence -WindowHandle $smokeProcess.MainWindowHandle -ImagePath $installedImage -Scenario 'installer-launch'
          $installedHash = (Get-FileHash -LiteralPath $installedApplication -Algorithm SHA256).Hash
          Add-Content -Path $evidenceReport -Value ('installed_exe_sha256=' + $installedHash) -Encoding utf8
          $smokeProcess.CloseMainWindow() | Out-Null
          if (-not $smokeProcess.WaitForExit(10000)) { throw 'Installed Ledgerline did not close cleanly after the smoke test.' }
          $smokeProcess.Dispose()
          $scenarios = @('titlebar', 'windows-sidebar-wide', 'windows-sidebar-medium', 'windows-sidebar-narrow', 'settings-light', 'settings-dark', 'settings-fa', 'currency-popup')
          foreach ($scenario in $scenarios) {
            Write-Host "Building visual scenario: $scenario"
            & flutter build windows --debug "--dart-define=LEDGERLINE_VISUAL_SCENARIO=$scenario"
            if ($LASTEXITCODE -ne 0) { throw "Windows debug build failed for scenario $scenario." }
            $applicationPath = Join-Path $PWD 'build/windows/x64/runner/Debug/ledgerline.exe'
            if (-not (Test-Path -LiteralPath $applicationPath)) { throw 'Debug application executable was not produced.' }
            $process = Start-Process -FilePath $applicationPath -PassThru
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Ledgerline exited during $scenario startup." }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) { break }
            }
            $process.Refresh()
            if ($process.MainWindowHandle -eq [IntPtr]::Zero) { throw "Ledgerline window was not available for $scenario." }
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ([LedgerlineWindowTest]::IsWindowVisible($process.MainWindowHandle)) { break }
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Ledgerline exited before the $scenario window became visible." }
            }
            if (-not [LedgerlineWindowTest]::IsWindowVisible($process.MainWindowHandle)) { throw "Ledgerline window was not shown for $scenario." }
            Start-Sleep -Seconds 2
            [LedgerlineWindowTest]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
            if ($scenario -like 'windows-sidebar-*') {
              [LedgerlineWindowTest]::ShowWindow($process.MainWindowHandle, 9) | Out-Null
              $windowWidth = switch ($scenario) {
                'windows-sidebar-wide' { 1440 }
                'windows-sidebar-medium' { 900 }
                default { 620 }
              }
              $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $windowHeight = [Math]::Min(850, $screen.Height)
              $windowX = [Math]::Max(0, [int](($screen.Width - $windowWidth) / 2))
              $windowY = [Math]::Max(0, [int](($screen.Height - $windowHeight) / 2))
              if (-not [LedgerlineWindowTest]::MoveWindow($process.MainWindowHandle, $windowX, $windowY, $windowWidth, $windowHeight, $true)) {
                throw "Could not resize the application for $scenario."
              }
              Start-Sleep -Milliseconds 700
            } else {
              [LedgerlineWindowTest]::ShowWindow($process.MainWindowHandle, 3) | Out-Null
              for ($attempt = 0; $attempt -lt 20; $attempt++) {
                if ([LedgerlineWindowTest]::IsZoomed($process.MainWindowHandle)) { break }
                Start-Sleep -Milliseconds 100
              }
              if (-not [LedgerlineWindowTest]::IsZoomed($process.MainWindowHandle)) { throw "The application window did not maximize for $scenario." }
            }
            [LedgerlineWindowTest]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 3
            if ([LedgerlineWindowTest]::GetForegroundWindow() -ne $process.MainWindowHandle) { throw "$scenario was not the foreground window when its screenshot was captured." }
            $imagePath = Join-Path $evidenceDirectory ($scenario + '.png')
            Save-WindowEvidence -WindowHandle $process.MainWindowHandle -ImagePath $imagePath -Scenario $scenario
            if ($scenario -eq 'titlebar') {
              try {
                [LedgerlineWindowTest]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
                Start-Sleep -Milliseconds 500
                if ([LedgerlineWindowTest]::GetForegroundWindow() -ne $process.MainWindowHandle) { throw 'Could not activate Ledgerline for keyboard shortcut verification.' }
                if (-not [LedgerlineWindowTest]::SendChord(0x46)) { throw 'Windows did not accept the Ctrl+Shift+F key input.' }
                Start-Sleep -Seconds 1
                if (-not [LedgerlineWindowTest]::IsZoomed($process.MainWindowHandle)) { throw 'Ctrl+Shift+F did not maximize the Ledgerline window.' }
                if (-not [LedgerlineWindowTest]::SendChord(0x46)) { throw 'Windows did not accept the Ctrl+Shift+F restore input.' }
                Start-Sleep -Seconds 1
                if ([LedgerlineWindowTest]::IsZoomed($process.MainWindowHandle)) { throw 'Ctrl+Shift+F did not restore the Ledgerline window.' }
                if (-not [LedgerlineWindowTest]::SendChord(0x4D)) { throw 'Windows did not accept the Ctrl+Shift+M key input.' }
                Start-Sleep -Seconds 1
                if (-not [LedgerlineWindowTest]::IsIconic($process.MainWindowHandle)) { throw 'Ctrl+Shift+M did not minimize the Ledgerline window.' }
                [LedgerlineWindowTest]::ShowWindow($process.MainWindowHandle, 9) | Out-Null
                Start-Sleep -Seconds 1
                if ([LedgerlineWindowTest]::IsIconic($process.MainWindowHandle)) { throw 'The Ledgerline window did not restore after minimizing.' }
              } catch {
                $verificationError = 'titlebar keyboard shortcuts: ' + $_.Exception.Message
                $script:uiVerificationFailures.Add($verificationError)
                Add-Content -Path $evidenceReport -Value ('verification_error=' + $verificationError) -Encoding utf8
                Write-Host ('UI_TEXT_ASSERTION_FAILED ' + $verificationError)
              }
            }
            $process.CloseMainWindow() | Out-Null
            if (-not $process.WaitForExit(10000)) { throw "Ledgerline did not close cleanly after capturing $scenario." }
            $process.Dispose()
          }
          $previewFiles = @(Get-ChildItem -LiteralPath $evidenceDirectory -Filter '*.png' | Sort-Object Name)
          if ($previewFiles.Count -gt 0) {
            $columns = 3
            $cellWidth = 480
            $cellHeight = 300
            $rows = [Math]::Ceiling($previewFiles.Count / [double]$columns)
            $contactSheet = [System.Drawing.Bitmap]::new($columns * $cellWidth, [int]($rows * $cellHeight))
            $sheetGraphics = [System.Drawing.Graphics]::FromImage($contactSheet)
            $labelFont = [System.Drawing.Font]::new('Arial', 12, [System.Drawing.FontStyle]::Bold)
            try {
              $sheetGraphics.Clear([System.Drawing.Color]::White)
              foreach ($index in 0..($previewFiles.Count - 1)) {
                $previewImage = [System.Drawing.Bitmap]::new($previewFiles[$index].FullName)
                try {
                  $column = $index % $columns
                  $row = [Math]::Floor($index / [double]$columns)
                  $cellX = $column * $cellWidth
                  $cellY = $row * $cellHeight
                  $sheetGraphics.DrawString($previewFiles[$index].BaseName, $labelFont, [System.Drawing.Brushes]::Black, [float]($cellX + 8), [float]($cellY + 5))
                  $maxWidth = $cellWidth - 20
                  $maxHeight = $cellHeight - 42
                  $scale = [Math]::Min($maxWidth / [double]$previewImage.Width, $maxHeight / [double]$previewImage.Height)
                  $targetWidth = [int][Math]::Round($previewImage.Width * $scale)
                  $targetHeight = [int][Math]::Round($previewImage.Height * $scale)
                  $targetX = $cellX + [int](($cellWidth - $targetWidth) / 2)
                  $targetY = $cellY + 30 + [int](($maxHeight - $targetHeight) / 2)
                  $sheetGraphics.DrawImage($previewImage, $targetX, $targetY, $targetWidth, $targetHeight)
                } finally {
                  $previewImage.Dispose()
                }
              }
              $contactPath = Join-Path $evidenceDirectory 'contact-sheet.jpg'
              $jpegCodec = @([System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' })[0]
              if ($null -eq $jpegCodec) { throw 'The JPEG encoder is unavailable for the UI evidence contact sheet.' }
              $encoderParameters = [System.Drawing.Imaging.EncoderParameters]::new(1)
              $encoderParameters.Param[0] = [System.Drawing.Imaging.EncoderParameter]::new([System.Drawing.Imaging.Encoder]::Quality, [long]65)
              try {
                $contactSheet.Save($contactPath, $jpegCodec, $encoderParameters)
              } finally {
                $encoderParameters.Dispose()
              }
            } finally {
              $labelFont.Dispose()
              $sheetGraphics.Dispose()
              $contactSheet.Dispose()
            }
            $previewBase64 = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($contactPath))
            Write-Host 'UI_EVIDENCE_PREVIEW_BEGIN'
            for ($offset = 0; $offset -lt $previewBase64.Length; $offset += 30000) {
              $chunkLength = [Math]::Min(30000, $previewBase64.Length - $offset)
              Write-Host ('UI_EVIDENCE_PREVIEW_CHUNK:' + $previewBase64.Substring($offset, $chunkLength))
            }
            Write-Host 'UI_EVIDENCE_PREVIEW_END'
          }

          if ($script:uiVerificationFailures.Count -gt 0) {
            throw ('Visible text verification failed for ' + $script:uiVerificationFailures.Count + ' screen(s): ' + ($script:uiVerificationFailures -join ' || '))
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ledgerline-windows-installer
          path: installer/output/ledgerline-windows-setup.exe
          if-no-files-found: error
      - name: Upload UI evidence, including failed captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerline-ui-evidence
          path: ui-evidence/*
          if-no-files-found: warn

  # Public publishing intentionally requires an explicit marker on a main-branch push.
  # Pull requests, feature branches, and manual builds only produce reviewable artifacts.
  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    needs: [analyze, test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read release tag
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml | head -n1 | cut -d+ -f1)"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ledgerline-windows-installer
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: ledgerline-ui-evidence
          path: release-assets/ui-evidence
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            release-assets/ledgerline-windows-setup.exe
            release-assets/ui-evidence/*.png
          generate_release_notes: true
